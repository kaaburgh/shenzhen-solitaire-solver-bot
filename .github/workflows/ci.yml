name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Compare hard dragon proof to base
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp tests/solver_cases/hard_dragon_deadlock.txt /tmp/hard_dragon_deadlock.txt

          git fetch --depth=1 origin 4f54360c72d564ab8ee7de20b435239bea400461
          git checkout --detach 4f54360c72d564ab8ee7de20b435239bea400461
          /usr/bin/time -f 'BASE_WALL=%e BASE_MAXRSS=%M' python - <<'PY'
          from pathlib import Path
          from shenzhen.solver import solve
          from shenzhen.textio import parse_board

          state = parse_board(Path("/tmp/hard_dragon_deadlock.txt").read_text())
          result = solve(state, max_nodes=400_000, time_limit=600.0)
          print(
              "BASE_HARD_DRAGON "
              f"status={result.status.value} nodes={result.nodes} "
              f"elapsed={result.elapsed:.6f}s"
          )
          PY

          git fetch --depth=1 origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          /usr/bin/time -f 'HEAD_WALL=%e HEAD_MAXRSS=%M' python - <<'PY'
          from pathlib import Path
          from shenzhen.solver import solve
          from shenzhen.textio import parse_board

          state = parse_board(Path("/tmp/hard_dragon_deadlock.txt").read_text())
          result = solve(state, max_nodes=400_000, time_limit=600.0)
          print(
              "HEAD_HARD_DRAGON "
              f"status={result.status.value} nodes={result.nodes} "
              f"elapsed={result.elapsed:.6f}s"
          )
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned rather than "latest": a new ruff release should be something we
      # opt into, not something that turns a green branch red overnight.
      - name: Install
        run: pip install "ruff==0.16.0"

      - name: Lint
        run: ruff check --output-format=github src/ tests/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shenzhen-solitaire-solver-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if the card templates made it in and the bot
      # can read them, so check that rather than just that the build exited 0.
      - name: The image can solve and can read its template bank
        run: |
          docker run --rm shenzhen-solitaire-solver-bot:ci python -c "
          from shenzhen.game import deal
          from shenzhen.solver import solve, Status
          from shenzhen.vision import load_bank

          result = solve(deal(0))
          assert result.status is Status.SOLVED, result.status
          print(f'solved a deal in {len(result.steps)} moves')

          bank = load_bank('/app/templates/default')
          assert bank is not None, 'no template bank in the image'
          assert not bank.missing, f'incomplete bank: {bank.missing}'
          print(f'loaded {len(bank)} card templates')
          "

      - name: It refuses to start without a token
        run: |
          if docker run --rm shenzhen-solitaire-solver-bot:ci; then
            echo "expected a non-zero exit with TELEGRAM_BOT_TOKEN unset" >&2
            exit 1
          fi
