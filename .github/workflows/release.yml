name: Release

# Fires when a GitHub Release is published -- not on every push, so cutting a
# release is the one deliberate action that ships an image. Draft a release
# from a tag, hit "Generate release notes" for the changelog, publish, done.
on:
  release:
    types: [published]

# Needed to push to GHCR with the workflow's own token -- no registry secret
# to manage. If this fails with 403, check Settings -> Actions -> General ->
# Workflow permissions is set to "Read and write permissions".
permissions:
  contents: read
  packages: write

# One group for every release, deliberately not keyed on the tag: each run
# moves the shared :latest tag, so two releases published close together must
# queue rather than race. Keyed per tag they would run concurrently and the
# slower build would win, leaving :latest pointing at the older release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never cancel a half-pushed release

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same two checks as the CI docker job -- repeated here rather than
      # trusted from that earlier run, so a release built from an unusual ref
      # (a hotfix tag off an old commit, say) can never ship an image that
      # cannot solve a deal or load its card templates.
      - name: The image can solve and can read its template bank
        run: |
          docker run --rm release-candidate python -c "
          from shenzhen.game import deal
          from shenzhen.solver import solve, Status
          from shenzhen.vision import load_bank

          result = solve(deal(0))
          assert result.status is Status.SOLVED, result.status
          print(f'solved a deal in {len(result.steps)} moves')

          bank = load_bank('/app/templates/default')
          assert bank is not None, 'no template bank in the image'
          assert not bank.missing, f'incomplete bank: {bank.missing}'
          print(f'loaded {len(bank)} card templates')
          "

      - name: It refuses to start without a token
        run: |
          if docker run --rm release-candidate; then
            echo "expected a non-zero exit with TELEGRAM_BOT_TOKEN unset" >&2
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the release's own tag (e.g. v1.2.0) and moved onto
      # :latest. Rebuilt from the same Dockerfile/context as the check
      # above -- buildx's layer cache makes this instant, not a second build.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
