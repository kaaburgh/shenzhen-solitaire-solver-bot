[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shenzhen-solitaire-solver-bot"
version = "0.1.0"
description = "Telegram bot that reads a Shenzhen Solitaire screenshot and says whether it is still winnable"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.10,<22",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "coverage>=7.6"]

[project.scripts]
shenzhen-bot = "shenzhen.bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff's defaults, plus import ordering and the pyupgrade rules.  Pinned
# explicitly so a new ruff release cannot turn CI red on its own.
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]
