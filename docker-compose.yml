services:
  bot:
    # Pulled by default -- `docker compose pull && docker compose up -d` is
    # the whole deploy. `docker compose up -d --build` still works for local
    # development; it just builds this same tag from source instead.
    image: ghcr.io/kaaburgh/shenzhen-solitaire-solver-bot:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SHENZHEN_TEMPLATES: /app/templates/default
      SHENZHEN_WORKERS: "2"
      LOG_LEVEL: INFO
      # Uncomment to measure which code real conversations actually reach, then
      # `docker compose up -d` to restart into it.  Costs the solver roughly a
      # fifth of its search budget; see docs/coverage.md before turning it on
      # and for how to read the data back out.
      # SHENZHEN_COVERAGE: /data/coverage
    volumes:
      # Survives restarts and image updates, so a week of measuring is a week
      # of data.  Holds nothing when coverage is switched off.
      - coverage:/data/coverage
    #
    # No bind mount over /app/templates on purpose. The card templates are
    # baked into the image and belong to the same release as the code that
    # reads them; mounting the checkout's copy on top would mask them, and
    # since `docker compose pull` never touches the checkout, a release that
    # recalibrates the bank would leave the deployment running new code
    # against old templates without saying anything.
    #
    # To try a locally rebuilt bank, put it in a docker-compose.override.yml
    # (Compose picks that up automatically and it is gitignored):
    #
    #   services:
    #     bot:
    #       volumes:
    #         - ./templates:/app/templates:ro

volumes:
  coverage:
